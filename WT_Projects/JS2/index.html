<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Translate It</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="header">Translate It</nav>

<div class="main">

    <textarea id="input-text" placeholder="Enter text here"></textarea>

    <div class="controls">
        <select id="source-lang">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="mr">Marathi</option>
            <option value="fr">French</option>
            <option value="de">German</option>
        </select>

        <select id="target-lang">
            <option value="hi">Hindi</option>
            <option value="en">English</option>
            <option value="mr">Marathi</option>
            <option value="fr">French</option>
            <option value="de">German</option>
        </select>
    </div>

    <button id="btn-translate">Translate</button>

    <textarea id="output-text" placeholder="Translated text will appear here" readonly></textarea>

</div>

<script src="translate.js"></script>
</body>
</html>

<h2>Student List</h2>

<!-- INPUT FORM -->
<input type="text" [(ngModel)]="newName" placeholder="Enter Name">
<input type="number" [(ngModel)]="newAge" placeholder="Enter Age">
<input type="text" [(ngModel)]="newCourse" placeholder="Enter Course">

<button (click)="addStudent()">Add Student</button>

<hr>

<ul>
  @for (s of students; track $index) {
    <li>
      {{ s.name }} | {{ s.age }} | {{ s.course }}
    </li>
  }
</ul>
